[project]
name = "macpkg-migrate"
version = "0.3.1"
requires-python = ">=3.9"
dependencies = ["macpkg-migrate-core>=0.3,<0.4"]
[project.scripts]
macpkg-migrate = "macpkg_migrate.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macpkg_migrate", "macpkg_migrate.*"]
